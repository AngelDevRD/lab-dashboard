name: Deploy to lab server

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "system/**"
      - ".github/workflows/**"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy (safe rollout with health check)
        id: deploy
        run: |
          set +e
          OUTPUT=$(ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s < system/ci_remote_deploy.sh)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "output<<DEPLOYEOF"
            echo "$OUTPUT"
            echo "DEPLOYEOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Write deploy summary
        if: always()
        run: |
          OUTPUT="${{ steps.deploy.outputs.output }}"
          STATUS=$(echo "$OUTPUT" | grep -oP '(?<=DEPLOY_STATUS=)\S+' | tail -1)
          COMMIT=$(echo "$OUTPUT" | grep -oP '(?<=DEPLOY_COMMIT=)\S+' | tail -1)
          DOWNTIME=$(echo "$OUTPUT" | grep -oP '(?<=DEPLOY_DOWNTIME=)\S+' | tail -1)
          ROLLBACK=$(echo "$OUTPUT" | grep -oP '(?<=DEPLOY_ROLLBACK=)\S+' | tail -1)
          ROLLBACK_COMMIT=$(echo "$OUTPUT" | grep -oP '(?<=DEPLOY_ROLLBACK_COMMIT=)\S+' | tail -1)
          STATUS="${STATUS:-unknown}"
          DURATION=$(( $(date +%s) - JOB_START ))

          {
            echo "## Deploy $( [ "$STATUS" = "success" ] && echo '✅ Éxito' || echo '❌ Error' )"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${COMMIT:-N/A}\` |"
            echo "| Fecha | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| Duración del deploy | ${DURATION}s |"
            echo "| Downtime estimado | ${DOWNTIME:-N/A}s |"
            echo "| Estado | $STATUS |"
            if [ "$ROLLBACK" = "success" ]; then
              echo "| Rollback | ✅ automático a \`${ROLLBACK_COMMIT:-commit anterior}\` — la tablet sigue mostrando la última versión estable |"
            elif [ "$ROLLBACK" = "failed" ]; then
              echo "| Rollback | ❌ el rollback automático también falló — revisar el servidor manualmente |"
            fi
            echo "| Dashboard | http://${{ secrets.SSH_HOST }}/ |"
            echo ""
            if [ "$STATUS" != "success" ]; then
              echo "<details><summary>Salida completa / logs</summary>"
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
