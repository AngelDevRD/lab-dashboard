services:
  lab-dashboard:
    build: .
    container_name: lab-dashboard
    restart: unless-stopped
    # 8600 atado a loopback (auditoría 2026-08-13).
    #
    # Los puertos publicados por Docker crean reglas DNAT en PREROUTING que se
    # evalúan ANTES que UFW, así que este puerto quedaba abierto a toda la LAN
    # y al tailnet aunque UFW solo permitiera el 80: se podia saltar nginx y su
    # TLS yendo directo a 192.168.100.8:8600 en claro.
    #
    # No basta con reglas en DOCKER-USER: ts-forward acepta el trafico que
    # entra por tailscale0 antes de que la cadena DOCKER-USER llegue a verlo.
    # Atarlo a loopback es la unica via fiable.
    #
    # No rompe ningun acceso: nginx hace de proxy a 127.0.0.1:8600 y todo el
    # trafico real del access.log entra por 443, tanto desde la LAN como desde
    # Tailscale (https://100.70.1.38/).
    ports:
      - "127.0.0.1:8600:8600"
    # Techos, no reservas. Uso real observado: 52 MB.
    mem_limit: 384m
    pids_limit: 256
    env_file:
      - ./backend/.env
    environment:
      - SSH_KEY_PATH=/app/.ssh/id_ed25519
    volumes:
      - ./backend/servers.json:/app/servers.json
      - ./logs:/logs
      - ./config/ssh:/app/.ssh:ro
      - ./config:/config:ro
      - ./data:/app/data
    labels:
      - "app=lab-dashboard"
      - "description=Lab Dashboard - FastAPI monitoring"
      - "maintainer=dashboard-deploy"
