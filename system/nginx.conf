# Reverse proxy para el dashboard. Copiar a /etc/nginx/sites-available/lab-dashboard
# y enlazar con: sudo ln -s /etc/nginx/sites-available/lab-dashboard /etc/nginx/sites-enabled/
#
# Para HTTPS (opcional, recomendado si se expone fuera de LAN):
#   1. sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#       -keyout /etc/ssl/private/lab-dashboard.key \
#       -out /etc/ssl/certs/lab-dashboard.crt \
#       -subj "/CN=lab-dashboard.local"
#   2. Descomentar el bloque server #443 y comentar el bloque :80
#
# Si solo se usa en LAN, el bloque :80 es suficiente.

server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}

