# Reverse proxy para el dashboard. Copiar a /etc/nginx/sites-available/lab-dashboard
# y enlazar con: sudo ln -s /etc/nginx/sites-available/lab-dashboard /etc/nginx/sites-enabled/
#
# HTTPS (recomendado incluso en LAN):
#   1. Generar certificado self-signed:
#      sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#        -keyout /etc/ssl/private/lab-dashboard.key \
#        -out /etc/ssl/certs/lab-dashboard.crt \
#        -subj "/CN=lab-dashboard.local"
#   2. Copiar este archivo a /etc/nginx/sites-available/lab-dashboard y habilitarlo
#   3. sudo nginx -s reload
#
# HTTP → HTTPS redirect (solo cuando el bloque 443 está activo)
# Si solo se usa en LAN sin TLS, comentar el redirect y dejar solo el bloque :80.

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/ssl/certs/lab-dashboard.crt;
    ssl_certificate_key /etc/ssl/private/lab-dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # El backend sirve HTML/CSS/JS sin comprimir (~70 KB en texto plano) y
    # /api/status devuelve el snapshot completo en JSON. Comprimir aquí es lo
    # que más acorta la carga inicial en la tablet; el WebSocket no pasa por
    # gzip, así que el resto del tiempo no cambia nada.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
