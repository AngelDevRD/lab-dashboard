# Reverse proxy para el dashboard. Copiar a /etc/nginx/sites-available/lab-dashboard
# y enlazar con: sudo ln -s /etc/nginx/sites-available/lab-dashboard /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name _;  # accesible por IP en la red local

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
