<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lab Dashboard</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo-dot"></span>
      <h1>Lab Dashboard</h1>
    </div>
    <div class="topbar-center" id="global-summary">
      <span class="pill" id="pill-online">-- online</span>
      <span class="pill pill-off" id="pill-offline">-- offline</span>
    </div>
    <div class="topbar-right">
      <span id="clock" class="clock">--:--:--</span>
      <span id="date" class="date">--</span>
      <button id="theme-toggle" class="icon-btn" title="Cambiar tema">🌙</button>
      <button id="fullscreen-toggle" class="icon-btn" title="Pantalla completa">⛶</button>
    </div>
  </header>

  <main>
    <section class="card internet-card" id="internet-card">
      <div class="card-header">
        <h2>Internet</h2>
        <span class="status-dot" id="internet-dot"></span>
      </div>
      <div class="internet-grid">
        <div><span class="label">Ping Google</span><span class="value" id="ping-google">--</span></div>
        <div><span class="label">Ping Cloudflare</span><span class="value" id="ping-cf">--</span></div>
        <div><span class="label">Última caída</span><span class="value" id="last-outage">--</span></div>
        <div><span class="label">Estado</span><span class="value" id="internet-state">--</span></div>
      </div>
    </section>

    <section id="server-grid" class="server-grid"></section>

    <section class="card log-card">
      <div class="card-header"><h2>Log de eventos</h2></div>
      <ul id="event-log" class="event-log"></ul>
    </section>
  </main>

  <div id="alert-banner" class="alert-banner hidden"></div>
  <audio id="alert-sound" preload="auto" src="/static/alert.mp3"></audio>

  <template id="server-card-template">
    <article class="card server-card">
      <div class="card-header">
        <h2 class="server-name">--</h2>
        <span class="status-dot"></span>
      </div>
      <div class="server-meta">
        <span class="uptime">Uptime: --</span>
        <span class="last-update">Actualizado: --</span>
      </div>

      <div class="metric">
        <div class="metric-label"><span>CPU</span><span class="metric-value cpu-percent">--%</span></div>
        <div class="bar"><div class="bar-fill cpu-bar"></div></div>
        <div class="metric-sub">
          <span class="cpu-temp">Temp: --</span>
          <span class="cpu-load">Load: --</span>
        </div>
      </div>

      <div class="metric">
        <div class="metric-label"><span>RAM</span><span class="metric-value mem-percent">--%</span></div>
        <div class="bar"><div class="bar-fill mem-bar"></div></div>
        <div class="metric-sub mem-detail">-- / --</div>
      </div>

      <div class="metric">
        <div class="metric-label"><span>Disco</span><span class="metric-value disk-percent">--%</span></div>
        <div class="bar"><div class="bar-fill disk-bar"></div></div>
        <div class="metric-sub disk-detail">-- / --</div>
      </div>

      <div class="metric-row">
        <div class="mini-stat"><span class="mini-label">IP</span><span class="net-ip mini-value">--</span></div>
        <div class="mini-stat"><span class="mini-label">↓</span><span class="net-down mini-value">--</span></div>
        <div class="mini-stat"><span class="mini-label">↑</span><span class="net-up mini-value">--</span></div>
      </div>

      <div class="docker-block">
        <span class="docker-label">Docker</span>
        <span class="docker-summary">-- corriendo / -- detenidos</span>
      </div>

      <div class="services-grid"></div>

      <div class="power-row">
        <span class="power-label">Energía</span>
        <span class="power-value">--</span>
      </div>

      <div class="procs-block">
        <div class="procs-col">
          <span class="procs-title">Top CPU</span>
          <ul class="top-cpu-list"></ul>
        </div>
        <div class="procs-col">
          <span class="procs-title">Top RAM</span>
          <ul class="top-mem-list"></ul>
        </div>
      </div>
    </article>
  </template>

  <script src="/static/js/app.js"></script>
</body>
</html>
